name: Server tests

on:
  push:
    branches: [main, 'perf/**', 'feat/**', 'fix/**']
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CI: true
          JWT_SECRET: ci-test-jwt-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/pictoria-ci-placeholder
          CLIENT_URL: http://localhost:5173
